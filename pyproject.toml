[project]
name = "llm-zoomcamp-wc2026"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "dlt[postgres]>=1.29.1",
    "mwparserfromhell>=0.7.2",
    "numpy>=2.5.1",
    "onnxruntime>=1.28.0",
    "openai>=2.52.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.60.0",
    "tokenizers>=0.23.1",
]

[dependency-groups]
dev = [
    "dlt[duckdb]>=1.29.1",
    "huggingface-hub>=1.26.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "agent", "monitoring", "app"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
